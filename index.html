<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Intertwingularity — a MADD group project</title>
<meta name="description" content="Four pieces, one path. Scroll down the plaza, find the cab won't start, walk home, and keep a desk at 2:57 a.m. from blowing up.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Silkscreen:wght@400&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #07070f; --iron: #0b0b16; --glass: #12142c; --lamp: #fff4c4; --taxi: #ffc21a;
    --stone: #8d8497; --stone-hi: #aca3b2; --dim: #6f6f8c;
    --ui: "Geist", -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--ink); color: var(--stone-hi); font-family: var(--ui); }
  body { overflow-x: hidden; }
  body.inside { overflow: hidden; }
  #scene { position: fixed; top: 0; left: 0; image-rendering: pixelated; image-rendering: crisp-edges; display: block; z-index: 1; touch-action: none; }
  #hi { position: fixed; top: 0; left: 0; z-index: 0; display: none; transition: opacity .25s; }
  /* for working on the piece: skip ahead from anywhere */
  #next { position: fixed; right: 14px; bottom: 14px; z-index: 7; font: 400 12px Silkscreen, monospace; letter-spacing: .04em; color: #fff4c4; background: #e8323a; border: 0; padding: 9px 14px 8px; cursor: pointer;
    box-shadow: 0 0 0 2px #07070f, 0 0 0 4px #7a1a26, 0 4px 0 4px #07070f; }
  #next:hover { background: #ff4a52; }
  #next:active { transform: translateY(2px); }
  body.desk #scene { cursor: none; }
  #spacer { width: 1px; }

  /* touch controls, phones only, while walking */
  #pad { position: fixed; inset: auto 0 0 0; z-index: 4; display: none; justify-content: space-between; align-items: flex-end; padding: 0 14px calc(14px + env(safe-area-inset-bottom)); pointer-events: none; }
  #pad.show { display: flex; }
  #pad .grp { display: flex; gap: 10px; pointer-events: auto; }
  #pad button {
    width: 62px; height: 62px; border-radius: 14px; border: 1px solid #34344c; background: rgba(11,11,22,.78); color: var(--stone-hi);
    font: 600 20px var(--ui); touch-action: none; user-select: none; -webkit-user-select: none;
  }
  #pad button.hot { background: #1d2146; border-color: var(--stone); }
  #pad .look { width: auto; padding: 0 16px; font-size: 13px; background: var(--taxi); color: var(--ink); border-color: var(--taxi); }
  #pad .look[hidden] { display: none; }

  /* a piece, opened from a shop window */
  #look { position: fixed; inset: 0; z-index: 6; background: rgba(7,7,15,.93); display: grid; place-items: center; padding: 24px 16px; }
  #look[hidden] { display: none; }
  .card { display: grid; grid-template-columns: minmax(0, auto) 220px; gap: 32px; align-items: end; max-width: 1180px; width: 100%; }
  .frame {
    justify-self: center; background: var(--ink); padding: 10px;
    box-shadow: 0 0 0 2px #35182a, 0 0 0 4px #8d8497, 0 0 0 6px #35182a, 0 0 0 8px #07070f, 0 24px 60px rgba(0,0,0,.6);
  }
  .frame img, .frame canvas { display: block; max-width: min(860px, 100%); max-height: 78vh; width: auto; height: auto; }
  .frame canvas { image-rendering: pixelated; }
  .frame [hidden] { display: none; }
  .label { font-size: 13px; line-height: 1.5; color: var(--stone); }
  .label .n { color: var(--taxi); margin: 0 0 14px; font-weight: 500; }
  .label .el { color: var(--stone-hi); font-size: 22px; font-weight: 600; letter-spacing: -0.01em; margin: 0 0 4px; }
  .label .t { font-style: italic; color: var(--stone-hi); margin: 0 0 10px; }
  .label .m { margin: 0 0 22px; }
  .label button { font: 500 12px var(--ui); background: none; color: var(--stone-hi); border: 1px solid #34344c; border-radius: 999px; padding: 8px 14px; cursor: pointer; }
  .label button:hover { border-color: var(--stone); }
  .label button:focus-visible { outline: 2px solid var(--taxi); outline-offset: 2px; }
  @media (max-width: 760px) {
    .card { grid-template-columns: 1fr; gap: 18px; }
    .frame img, .frame canvas { max-height: 62vh; }
  }
</style>
</head>
<body>
<canvas id="hi" aria-hidden="true"></canvas>
<canvas id="scene" aria-label="A pixel-art street at night. Scroll down the plaza to the cab, walk home, and keep the desk inside from blowing up."></canvas>
<div id="spacer"></div>
<button id="next" type="button">NEXT LEVEL</button>

<div id="pad" aria-hidden="true">
  <div class="grp"><button data-k="left">&#9664;</button><button data-k="right">&#9654;</button></div>
  <div class="grp"><button class="look" id="pad-look" hidden>Look</button><button data-k="down">&#9660;</button><button data-k="up">&#9650;</button></div>
</div>

<div id="look" hidden role="dialog" aria-modal="true" aria-labelledby="look-el">
  <div class="card">
    <div class="frame" id="look-frame"><img id="look-img" alt=""><canvas id="look-canvas" hidden></canvas></div>
    <div class="label">
      <p class="n" id="look-n"></p>
      <p class="el" id="look-el"></p>
      <p class="t" id="look-t"></p>
      <p class="m" id="look-m"></p>
      <button id="look-back" type="button">Back to the street</button>
    </div>
  </div>
</div>

<script>
(() => {
/* =====================================================================
   the group. edit names, titles, and media here; they show up on the
   plaza, on the shop signs' captions, and on the level cards.
   ===================================================================== */
const GROUP = [
  { name: 'ARON',     title: 'MADD HW1 (the street)', medium: 'HTML canvas, Web Audio, pixel art' },
  { name: 'PHOENIX',  title: 'The Desk',              medium: 'Digital collage on a photograph' },
  { name: 'SAM', title: 'Germany Head',          medium: 'Digital drawing on satellite imagery' },
  { name: 'AASHMAN', title: 'Inbox',                 medium: 'ASCII art in Gmail drafts' },
];
const LEVEL_SECONDS = 45;    // real seconds from 2:57 to 3:00 at the desk

/* =====================================================================
   palette, font, dithering: the same system as the canal st project and hw1
   ===================================================================== */
const P = {
  ink: '#07070f', iron: '#0b0b16', glass: '#12142c', glass_hi: '#1d2146',
  mortar: '#35182a', brick: ['#5c2233', '#6b2a37', '#7a333b'],
  stone: '#8d8497', stone_hi: '#aca3b2', stone_dark: '#5f5870',
  lime: ['#5f5c74', '#6b6881', '#76728b'], brown: ['#40232e', '#4b2a33'],
  cornice: '#221a28', walk: '#34344c', walk_dk: '#2b2b40', curb: '#6f6f8c',
  road: ['#101122', '#14152a'], lamp: '#fff4c4',
  warm: ['#8a4a30', '#e38c46', '#ffc670', '#ffe7a8'],
  kitchen: ['#8c7a5c', '#d8c38f', '#fff0c4', '#fffbe8'],
  tv: ['#2c3a86', '#4f6fd8', '#8fb4ff', '#d6e4ff'],
  led: ['#5a2a86', '#a44ee0', '#e08cff', '#f6d2ff'],
  teal: ['#1f5a64', '#34a8a0', '#6ee6d4', '#c8fff4'],
  taxi: '#ffc21a', taxi_dark: '#c98a00', red: '#e8323a', red_dark: '#7a1a26',
  paint: '#b9b2a4', paint_dk: '#7d7787',
  water: ['#090d24', '#0c1230', '#111a40'],
  leaf: ['#0e1d1c', '#142826', '#1b3532'],
  maroon: '#800000', paper: '#ece8f2', paper_dk: '#b9b4c6', green: '#6ee6a0',
};
const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];
const bay = (x, y) => BAYER[(y & 3) * 4 + (x & 3)];
let seed = 7;
const rnd = () => ((seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296);
const hash = (x, y) => { let h = (x * 374761393 + y * 668265263) >>> 0; h = ((h ^ (h >>> 13)) * 1274126177) >>> 0; return (h & 0xffff) / 65536; };
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;

function rect(g, x, y, w, h, c) { g.fillStyle = c; g.fillRect(Math.round(x), Math.round(y), Math.max(1, Math.round(w)), Math.max(1, Math.round(h))); }
const SILK = '"Silkscreen", "Courier New", monospace';
/* Text: Silkscreen, a pixel font, drawn once per string, thresholded to hard pixels and cached,
   so it stays crisp on the pixel grid but is far easier to read than a 3x5 font. */
const glyphs = new Map();
function fbits(s, px, weight = 400, family = SILK) {
  const key = s + '|' + px + '|' + weight + '|' + family;
  if (glyphs.has(key)) return glyphs.get(key);
  const c = document.createElement('canvas'), x = c.getContext('2d');
  x.font = `${weight} ${px}px ${family}`;
  const w = Math.ceil(x.measureText(s).width) + 6, h = Math.ceil(px * 1.5) + 4;
  c.width = w; c.height = h;
  x.font = `${weight} ${px}px ${family}`; x.textBaseline = 'top'; x.fillStyle = '#fff'; x.fillText(s, 2, 2);
  const d = x.getImageData(0, 0, w, h).data;
  let x0 = w, y0 = h, x1 = -1, y1 = -1;
  for (let yy = 0; yy < h; yy++) for (let xx = 0; xx < w; xx++) if (d[(yy * w + xx) * 4 + 3] > 120) { if (xx < x0) x0 = xx; if (xx > x1) x1 = xx; if (yy < y0) y0 = yy; if (yy > y1) y1 = yy; }
  const out = { w: Math.max(0, x1 - x0 + 1), h: Math.max(0, y1 - y0 + 1), on: [] };
  for (let yy = y0; yy <= y1; yy++) for (let xx = x0; xx <= x1; xx++) if (d[(yy * w + xx) * 4 + 3] > 120) out.on.push(xx - x0, yy - y0);
  glyphs.set(key, out);
  return out;
}
/** draw text; center = x is the middle. worn = how much paint has scuffed off (0..1) */
function ftext(g, s, x, y, color, px, center = false, worn = 0, weight = 400, family = SILK) {
  const b = fbits(s, px, weight, family), X = Math.round(center ? x - b.w / 2 : x), Y = Math.round(y);
  g.fillStyle = color;
  for (let i = 0; i < b.on.length; i += 2) {
    const xx = X + b.on[i], yy = Y + b.on[i + 1];
    if (worn && hash(xx, yy) < worn) continue;
    g.fillRect(xx, yy, 1, 1);
  }
  return b;
}
/** small text in Silkscreen, a pixel font drawn for tiny sizes (use 8 or 16 so it lands on the grid) */
const stext = (g, s, x, y, color, px = 8, center = true) => ftext(g, s, x, y, color, px, center, 0, 400, SILK);
const sbits = (s, px = 8) => fbits(s, px, 400, SILK);
/** the same, with a one-pixel dark keyline so it reads over anything */
function otext(g, s, x, y, color, px = 8, center = true, line = P.ink) {
  for (const [ox, oy] of [[-1, 0], [1, 0], [0, -1], [0, 1], [1, 1]]) stext(g, s, x + ox, y + oy, line, px, center);
  return stext(g, s, x, y, color, px, center);
}

/* a 3x5 font for the things on the desk too small for Silkscreen: receipts, dialogs, homework */
const MF = {
  A: '010101111101101', B: '110101110101110', C: '011100100100011', D: '110101101101110', E: '111100110100111',
  F: '111100110100100', G: '011100101101011', H: '101101111101101', I: '111010010010111', J: '001001001101010',
  K: '101101110101101', L: '100100100100111', M: '101111111101101', N: '110101101101101', O: '010101101101010',
  P: '110101110100100', Q: '010101101110011', R: '110101110101101', S: '011100010001110', T: '111010010010010',
  U: '101101101101111', V: '101101101101010', W: '101101111111101', X: '101101010101101', Y: '101101010010010',
  Z: '111001010100111', 0: '111101101101111', 1: '010110010010111', 2: '110001010100111', 3: '110001010001110',
  4: '101101111001001', 5: '111100110001110', 6: '011100111101111', 7: '111001010010010', 8: '111101111101111',
  9: '111101111001110', ':': '000010000010000', '.': '000000000000010', ',': '000000000010100', '-': '000000111000000',
  '+': '000010111010000', '=': '000111000111000', '?': '110001010000010', '!': '010010010000010', '$': '011110010011110',
  '/': '001001010100100', '(': '001010010010001', ')': '100010010010100', "'": '010010000000000', '>': '100010001010100',
  '<': '001010100010001', ' ': '000000000000000', '#': '101111101111101', '%': '101001010100101', '*': '000101010101000',
};
function mtext(g, s, x, y, color, center = false) {
  s = String(s).toUpperCase();
  const w = s.length * 4 - 1;
  let X = Math.round(center ? x - w / 2 : x); const Y = Math.round(y);
  g.fillStyle = color;
  for (const ch of s) {
    const m = MF[ch] || MF['?'];
    for (let i = 0; i < 15; i++) if (m[i] === '1') g.fillRect(X + (i % 3), Y + ((i / 3) | 0), 1, 1);
    X += 4;
  }
  return w;
}

/** dithered pool of light, added on top of whatever is there */
function pool(g, cx, cy, rx, ry, rgb, a1 = 0.16, a2 = 0.12) {
  const prev = g.globalCompositeOperation; g.globalCompositeOperation = 'lighter';
  const c1 = `rgba(${rgb},${a1})`, c2 = `rgba(${rgb},${a2})`;
  for (let y = Math.floor(cy - ry); y <= cy + ry; y++) for (let x = Math.floor(cx - rx); x <= cx + rx; x++) {
    const dx = (x + 0.5 - cx) / rx, dy = (y + 0.5 - cy) / ry, d = dx * dx + dy * dy;
    if (d >= 1) continue;
    const t = (1 - Math.sqrt(d)); const lvl = t * t * 19;
    if (lvl > bay(x, y)) { g.fillStyle = c1; g.fillRect(x, y, 1, 1); }
    if (lvl > bay(x, y) + 9) { g.fillStyle = c2; g.fillRect(x, y, 1, 1); }
  }
  g.globalCompositeOperation = prev;
}
function hexRGB(h) { const n = parseInt(h.slice(1), 16); return `${n >> 16},${(n >> 8) & 255},${n & 255}`; }

/* =====================================================================
   the street, in art pixels: hw1's world, with new signs and a way home
   ===================================================================== */
const WW = 1280, WH = 1520;
const PLAZA = { x0: 480, x1: 800 };
const SIDEWALK_N = 1286, BLVD0 = 1300, BLVD1 = 1392, SIDEWALK_S = 1410, CANAL0 = 1412, CANAL1 = 1472;
const ROOF0 = 1190, FACADE0 = 1232;

// the shops along the boulevard. three are the group's pieces, one is home, one is closed till 3.
const STORES = [
  { n: 1, key: 'STREET', who: 0, src: null,                    x: 30,  w: 130, mat: 'brick', neon: P.teal, chord: [220.00, 261.63, 329.63, 440.00] },
  { n: 2, key: 'HEAD',   who: 2, src: 'assets/germany-head.png', x: 185, w: 130, mat: 'lime',  neon: P.led,  chord: [196.00, 246.94, 293.66, 392.00] },
  { n: 3, key: 'INBOX',  who: 3, src: 'assets/inbox.png',      x: 340, w: 125, mat: 'brown', neon: P.tv,   chord: [174.61, 220.00, 261.63, 349.23] },
  { n: 4, key: 'HOME',   who: 1, src: 'assets/desk-photo.jpg', x: 815, w: 130, mat: 'brick', neon: P.warm, chord: [261.63, 329.63, 392.00, 523.25], home: true },
  { n: 5, key: 'CLOSED', who: -1, src: null,                   x: 970, w: 130, mat: 'stone', neon: ['#3a1420', '#5a2030', '#6b2a37', '#ffb0b8'], chord: [146.83, 220.00, 261.63, 293.66], closed: true },
];
STORES.forEach(p => { p.cx = p.x + p.w / 2; p.pad = { x0: p.cx - 22, x1: p.cx + 22, y0: BLVD0 + 2, y1: BLVD0 + 26 }; });
const HOME = STORES.find(p => p.home);

// the plaza, painted. every name is tied to every other name: four people, six threads.
const ROWS = [
  { y: 306, s: 'INTER',        px: 24, note: 110.00 },
  { y: 334, s: 'TWINGULARITY', px: 24, note: 130.81 },
  { y: 372, s: 'A MADD GROUP PROJECT', px: 8, note: 164.81, col: '#d8d2c4' },
];
const WEB = { y0: 404, y1: 456, dx: 74 };
const QUOTE = [
  { y: 494, s: 'EVERYTHING IS DEEPLY', px: 8, note: 329.63, col: '#8f8899' },
  { y: 506, s: 'INTERTWINGLED.',       px: 8, note: 392.00, col: '#8f8899' },
  { y: 520, s: '- TED NELSON',         px: 8, note: 440.00, col: '#5f5870' },
];
const START = { y: 40 };
const PLATE = { y: 262 };
const INTER = { y: 760 };
const CREST = { cx: 640, y: 858, w: 72, h: 91 };
const TILE = { x0: 616, x1: 664, y0: 1036, y1: 1068 };
const CAR0 = { x: 640, y: 812, a: Math.PI / 2 };

/* =====================================================================
   bake the still layer once
   ===================================================================== */
const imgs = STORES.map(p => { if (!p.src) return null; const im = new Image(); im.src = p.src; return im; });
let world = null;
const lamps = [];

function bake() {
  seed = 7;
  const c = document.createElement('canvas'); c.width = WW; c.height = WH;
  const g = c.getContext('2d'); g.imageSmoothingEnabled = false;

  rect(g, 0, 0, WW, WH, P.iron);
  cityRows(g, 0, PLAZA.x0, 4, ROOF0 - 4);
  cityRows(g, PLAZA.x1, WW, 4, ROOF0 - 4);

  // the plaza: asphalt with the title painted on it
  rect(g, PLAZA.x0, 0, PLAZA.x1 - PLAZA.x0, BLVD0, P.road[0]);
  rect(g, PLAZA.x0, 0, 6, SIDEWALK_N, P.walk); rect(g, PLAZA.x1 - 6, 0, 6, SIDEWALK_N, P.walk);
  rect(g, PLAZA.x0 + 6, 0, 1, SIDEWALK_N, P.curb); rect(g, PLAZA.x1 - 7, 0, 1, SIDEWALK_N, P.curb);
  const mid = (PLAZA.x0 + PLAZA.x1) / 2;
  stext(g, 'SCROLL DOWN', mid, START.y, P.paint, 8, true);
  for (const ay of [70, 92, 114, 136, 158]) for (let i = 0; i < 5; i++) rect(g, mid - 4 + i, ay + i, 9 - 2 * i, 1, P.paint_dk);
  { const t = sbits('FOUR PIECES, ONE PATH', 8), w = t.w + 22, h = t.h + 14, x = Math.round(mid - w / 2);
    rect(g, x, PLATE.y, w, h, P.taxi_dark); rect(g, x + 1, PLATE.y + 1, w - 2, h - 2, P.road[1]);
    stext(g, 'FOUR PIECES, ONE PATH', mid, PLATE.y + 7, P.taxi, 8, true); }
  for (const r of ROWS) r.h = stext(g, r.s, mid, r.y, r.col || P.paint, r.px, true).h;
  // the names, and a thread between every pair of them
  const spots = [[mid - WEB.dx, WEB.y0], [mid + WEB.dx, WEB.y0], [mid - WEB.dx, WEB.y1], [mid + WEB.dx, WEB.y1]];
  const anchors = spots.map(([x, y], i) => [x, y + (i < 2 ? 12 : -4)]);
  for (let i = 0; i < 4; i++) for (let j = i + 1; j < 4; j++) thread(g, anchors[i], anchors[j]);
  venn(g, mid, (WEB.y0 + WEB.y1) / 2 + 4, 5, [P.taxi_dark, P.taxi_dark, P.taxi_dark, P.taxi_dark], P.road[0]);
  GROUP.forEach((m, i) => { const [x, y] = spots[i]; stext(g, m.name, x, y, '#d8d2c4', 8, true); });
  for (const r of QUOTE) r.h = stext(g, r.s, mid, r.y, r.col, r.px, true).h;
  // size ruler down the left side, as in hw1
  for (const r of ROWS) rect(g, PLAZA.x0 + 14, r.y, 3, r.h, P.taxi_dark);
  rect(g, PLAZA.x0 + 15, ROWS[0].y, 1, QUOTE[QUOTE.length - 1].y + 6 - ROWS[0].y, P.paint_dk);
  stext(g, 'KEEP SCROLLING', mid, 580, '#bdb6a6', 8, true);
  for (const ay of [604, 630, 656, 682, 708]) for (let i = 0; i < 5; i++) rect(g, mid - 4 + i, ay + i, 9 - 2 * i, 1, P.paint_dk);
  // the cab, where hw1 left it
  stext(g, 'MADD HW1', mid, INTER.y + 6, P.taxi, 8, true);
  stext(g, 'THIS IS YOU', mid, INTER.y + 18, '#8f8899', 8, true);
  rect(g, mid - 13, 794, 26, 1, P.paint_dk); rect(g, mid - 13, 830, 26, 1, P.paint_dk);
  rect(g, mid - 13, 794, 1, 37, P.paint_dk); rect(g, mid + 12, 794, 1, 37, P.paint_dk);
  for (let i = 0; i < 52; i++) for (let j = 0; j < 2; j++) rect(g, mid - 52 + i * 2, 838 + j * 2, 2, 2, (i + j) % 2 ? P.paint : P.road[1]);
  crest(g, CREST.cx, CREST.y);
  stext(g, 'THE UNIVERSITY OF CHICAGO', mid, CREST.y + CREST.h + 8, P.paint, 8, true);
  for (let i = 0; i < 5; i++) rect(g, mid - 4 + i, 1012 + i, 9 - 2 * i, 1, P.paint_dk);
  { const { x0, x1, y0, y1 } = TILE;
    rect(g, x0 - 2, y0 - 2, x1 - x0 + 4, y1 - y0 + 4, P.stone_dark);
    rect(g, x0, y0, x1 - x0, y1 - y0, P.ink);
    const nx = Math.round((x0 + x1) / 2), ny = y0 + 6;
    rect(g, nx + 2, ny, 2, 14, P.led[2]); rect(g, nx + 4, ny, 5, 2, P.led[2]); rect(g, nx + 7, ny + 2, 2, 3, P.led[2]);
    rect(g, nx - 3, ny + 12, 6, 5, P.led[2]); rect(g, nx - 2, ny + 11, 4, 1, P.led[2]); rect(g, nx - 2, ny + 17, 4, 1, P.led[2]);
    stext(g, 'SOUND', mid, y1 + 10, P.led[2], 8, true);

/** a dotted, slightly sagging thread from a to b */
function thread(g, a, b) {
  const n = Math.ceil(Math.hypot(b[0] - a[0], b[1] - a[1]));
  for (let i = 0; i <= n; i += 2) {
    const t = i / n, sag = Math.sin(t * Math.PI) * 3;
    rect(g, lerp(a[0], b[0], t), lerp(a[1], b[1], t) + sag, 1, 1, i % 6 ? P.taxi_dark : P.paint_dk);
  }
}
/** four rings overlapping in a flower, like the "(impossible)" napkin on the desk: one ring each */
function venn(g, cx, cy, r, cols, fill) {
  const c = [[-1, -1], [1, -1], [-1, 1], [1, 1]].map(([u, v]) => [cx + u * r * 0.62, cy + v * r * 0.62]);
  for (let y = Math.floor(cy - r * 2); y <= cy + r * 2; y++) for (let x = Math.floor(cx - r * 2); x <= cx + r * 2; x++) {
    let inside = 0, edge = -1;
    c.forEach(([px, py], i) => { const d = Math.hypot(x + 0.5 - px, y + 0.5 - py); if (d < r - 0.6) inside++; else if (d < r + 0.5) edge = i; });
    if (edge >= 0 && inside < 2) rect(g, x, y, 1, 1, cols[edge]);
    else if (inside >= 2 && fill) rect(g, x, y, 1, 1, fill);
  }
}

/* one 4 x 6 window: dark frame, a center bar, a stone sill; lit rooms glow brighter at the top */
function win(g, wx, wy, litChance = 0.36) {
  rect(g, wx - 1, wy - 1, 6, 8, P.ink);
  const lit = hash(wx, wy) < litChance, pal = [P.warm, P.kitchen, P.tv, P.led][(hash(wy, wx) * 4) | 0];
  if (lit) {

    if (hash(wx, 3) < 0.4) rect(g, wx, wy + 3, 4, 3, pal[0]);
    if (hash(wx, wy + 7) < 0.25) rect(g, wx + 3, wy + 3, 1, 3, P.ink);
  } else { rect(g, wx, wy, 4, 6, P.glass); rect(g, wx, wy, 1, 6, P.glass_hi); }

/** a 2x2 linear system with one, zero, or infinitely many solutions, from the notes on the desk */
function system() {
  const r = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
  const kind = ['ONE', 'ZERO', 'INFINITE'][r(0, 2)];
  let a = r(1, 4), b = r(1, 4), c, d, e, f;
  const x = r(0, 3), y = r(0, 3); e = a * x + b * y;
  if (kind === 'ONE') { do { c = r(1, 4); d = r(1, 4); } while (a * d === b * c); f = c * x + d * y; }
  else { const k = r(2, 3); c = a * k; d = b * k; f = kind === 'INFINITE' ? e * k : e * k + r(1, 3); }
  const eq = (p, q, s) => `${p === 1 ? '' : p}X+${q === 1 ? '' : q}Y=${s}`;
  return { answer: kind, eqs: [eq(a, b, e), eq(c, d, f)] };
}

}

/* ---------- the clock: 2:57 to 3:00 ---------- */
function deskClock() {
  const secs = 2 * 3600 + 57 * 60 + clamp(D.t, 0, LEVEL_SECONDS) / LEVEL_SECONDS * 180;
  const h = Math.floor(secs / 3600), m = Math.floor(secs / 60) % 60, s = Math.floor(secs) % 60;
  return { h, m, s, str: `${h}:${String(m).padStart(2, '0')}`, full: `${h}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')} AM` };
}

function deskUpdate(dt) {
  D.t += dt;
  for (const f of D.floats) f.t += dt;
  D.floats = D.floats.filter(f => f.t < 1.2);
  for (const p of D.debris) { p.t += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += p.g * dt; p.vx *= 0.97; }
  D.debris = D.debris.filter(p => p.t < p.life);
  D.shake *= Math.exp(-dt * 5); D.flash = Math.max(0, D.flash - dt * 5);
  for (const p of D.parts) { p.t += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 300 * dt; p.a += p.va * dt; }

  // the fan eases toward whatever it's been asked to do
  D.fanTarget = D.fanTarget || 1;
  if (!D.events.some(e => e.id === 'fan')) D.fanTarget = 1;
  D.fanSpeed += (D.fanTarget - D.fanSpeed) * Math.min(1, dt * 2.5);
  D.fanRot += D.fanSpeed * dt * 5;
  if (A.ctx) { A.fanG.gain.setTargetAtTime(0.012 + Math.max(0, D.fanSpeed - 1) * 0.03, A.ctx.currentTime, 0.2); A.fanF.frequency.setTargetAtTime(380 + D.fanSpeed * 260, A.ctx.currentTime, 0.2); }
  // things lift and shiver in the wind
  const wind = Math.max(0, D.fanSpeed - 1.4);
  for (const k of ['calendar', 'receipt', 'napkin', 'flash']) if (!D.events.some(e => e.id === k)) D.off[k].y = wind > 0 && Math.random() < wind * 0.4 ? -1 : 0;
  for (const m of D.motes) { m.y += m.v * dt * (1 + wind * 3); m.x -= wind * 40 * dt; m.p += dt; if (m.y > 200 || m.x < 200) { m.y = Math.random() * 30; m.x = 260 + Math.random() * 140; } }

  if (D.state === 'boom') { D.boomT += dt; return; }
  if (D.state === 'won') { D.winT += dt; if (D.winT > 3.4 && sceneName === 'desk') startLookup(); return; }
  if (D.t < 0) return;

  // the second hand
  if (Math.floor(D.t - dt) !== Math.floor(D.t)) hiss(0.012, 6000, { vol: 0.02 });
  if (D.luckT > 0) D.luckT -= dt;

  // three o'clock: everything else goes quiet, and the alarm goes off for real
  if (D.t >= LEVEL_SECONDS && !D.finale) {
    D.finale = true;
    for (const e of [...D.events]) { MODS[e.id].end && MODS[e.id].end(e); }
    D.events = []; D.lamp = 1; D.fanTarget = 1;
    spawn('clock', { final: true });
  }
  if (!D.finale) {
    for (const [at, id] of SCRIPT) if (D.t >= at && D.t - dt < at && !D.events.some(e => e.id === id)) spawn(id);
    if (D.t > SCRIPT[SCRIPT.length - 1][0] + 1.5) {
      D.next -= dt;
      // overlap is the game: up to three things at once early, five by the end, and sometimes two go off together
      const prog = clamp(D.t / LEVEL_SECONDS, 0, 1), cap = prog < 0.3 ? 3 : prog < 0.7 ? 4 : 5;
      if (D.next <= 0 && D.events.length < cap && D.t < LEVEL_SECONDS - 3) {
        const burst = prog > 0.25 && Math.random() < 0.2 + prog * 0.35 && D.events.length + 2 <= cap ? 2 : 1;
        for (let b = 0; b < burst; b++) {
          const free = POOL.filter(id => !D.events.some(e => e.id === id) && (id !== 'lamp' || D.t > 24));
          // things you haven't seen yet come first
          const fresh = free.filter(id => !(D.seen || {})[id]), from = fresh.length ? fresh : free;
          const pick = from[Math.floor(Math.random() * from.length)];
          if (pick) spawn(pick);
        }
        D.next = lerp(3.6, 1.6, prog) * (0.7 + Math.random() * 0.6);
      }
    }
  }
  for (const e of [...D.events]) {
    e.dt = dt;
    if (D.luckT <= 0 || e.final) e.t += dt;
    if (e.shake) e.shake = Math.max(0, e.shake - dt);
    if (e.keyFlash) { for (const k of e.keyFlash) k.t -= dt; e.keyFlash = e.keyFlash.filter(k => k.t > 0); }
    const r = MODS[e.id].update && MODS[e.id].update(e, dt);
    if (r === 'done') { resolve(e); continue; }
    // the last quarter of a fuse ticks
    const left = e.fuse - e.t;
    if (left < e.fuse * 0.3 && Math.floor((e.t - dt) * (6 + 10 * (1 - left / e.fuse))) !== Math.floor(e.t * (6 + 10 * (1 - left / e.fuse)))) note(2400, 0.02, 'square', 0.01);
    if (e.t >= e.fuse) { explode(e); return; }
  }
}

/* ---------- it all blows up ---------- */
function explode(e) {

  D.state = 'boom'; D.boomT = 0; D.cause = m.cause; D.when = deskClock().full;
  const r = m.rect(); D.blast = [(r[0] + r[2]) / 2, (r[1] + r[3]) / 2];
  for (const ev of D.events) MODS[ev.id].end && MODS[ev.id].end(ev);
  D.events = [];
  D.shake = 9; D.flash = 1;
  // every loose thing on the desk goes flying
  for (const k in OBJ) {
    if (D.hidden[k]) continue;

  document.getElementById('look-el').textContent = m.title;
  document.getElementById('look-t').textContent = m.name.split(' ').map(w => w[0] + w.slice(1).toLowerCase()).join(' ');
  document.getElementById('look-m').textContent = m.medium;
  lookEl.hidden = false;
  arp(p.chord.concat([p.chord[0] * 2]), 0.14, 'triangle', 0.07);
  document.getElementById('look-back').focus();
}
function closeLook() { lookEl.hidden = true; mode = 'walk'; }
document.getElementById('look-back').addEventListener('click', closeLook);
lookEl.addEventListener('click', e => { if (e.target === lookEl) closeLook(); });
padLook.addEventListener('click', () => openLook(nearStore));

// the red button: skip to the next part, from anywhere (for building and testing; take it out for the final piece)
function nextLevel() {
  if (!A.ctx) setSound(true);
  lookEl.hidden = true;
  if (sceneName === 'street') { document.body.style.overflow = 'hidden'; startDesk(); }
  else if (sceneName === 'card') { if (card.L.end) card.L.start(); else card.L.start(); }
  else if (sceneName === 'desk') { if (D.state !== 'won') { D.events = []; D.finale = true; D.lamp = 1; D.state = 'play'; winLevel(); D.winT = 2.4; } else startLookup(); }
  else if (sceneName === 'lookup') startMap(null);
  else if (sceneName === 'map') startDive();
  else if (sceneName === 'dive') startInbox();
  else if (sceneName === 'inbox') startCard(4);
}
document.getElementById('next').addEventListener('click', e => { e.stopPropagation(); nextLevel(); });

const KEYMAP = { ArrowUp: 'up', KeyW: 'up', ArrowDown: 'down', KeyS: 'down', ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right' };
addEventListener('keydown', e => {
  if (!A.ctx) setSound(true);
  if (e.code === 'KeyM' && sceneName !== 'desk') { setSound(!A.on); return; }
  if (sceneName === 'card') { if (card.ready && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); card.L.start(); } return; }
  if (sceneName === 'desk') {
    if (e.key === 'Escape') return;
    const lap = D.events.find(v => v.id === 'laptop');
    if (lap && /^[a-z]$/i.test(e.key) && D.state === 'play') { e.preventDefault(); const r = MODS.laptop.key(lap, e.key.toUpperCase()); if (r === 'done') resolve(lap); return; }
    if ((e.key === 'Enter' || e.key === ' ') ) { e.preventDefault(); deskDown(-999, -999); }
    return;
  }
  if (mode === 'look') { if (e.key === 'Escape' || e.key === 'Enter' || e.key === ' ') { e.preventDefault(); closeLook(); } return; }
  const k = KEYMAP[e.code];
  if (mode === 'intro') { if (k && canDrive) { e.preventDefault(); stall(); } return; }
  if (mode === 'walk') {
    if (k) { e.preventDefault(); keys[k] = true; }
    if (e.key === 'Shift') keys.run = true;
    if ((e.code === 'KeyE' || e.code === 'Enter' || e.code === 'Space') && nearStore) { e.preventDefault(); openLook(nearStore); }
    else if (e.code === 'Space') e.preventDefault();
    return;
  }
  if (k) e.preventDefault();
});
addEventListener('keyup', e => { const k = KEYMAP[e.code]; if (k) keys[k] = false; if (e.key === 'Shift') keys.run = false; });
addEventListener('blur', () => { Object.keys(keys).forEach(k => keys[k] = false); ptr.down = false; });

function artXY(e) { return [e.clientX / K, e.clientY / K]; }
addEventListener('pointerdown', e => {
  if (!A.ctx) setSound(true);
  if (e.target.closest && (e.target.closest('#look') || e.target.closest('#pad') || e.target.closest('#next'))) return;
  const [x, y] = artXY(e); ptr.x = x; ptr.y = y; ptr.down = true;
  if (sceneName === 'street') { if (mode === 'intro' && canDrive) stall(); return; }
  if (sceneName === 'card') { if (card.ready) card.L.start(); return; }
  if (sceneName === 'desk') deskDown(x - D.ox, y - D.oy);
});
addEventListener('pointermove', e => {
  const [x, y] = artXY(e), dx = x - ptr.x; ptr.x = x; ptr.y = y;
  if (sceneName !== 'desk' || D.state !== 'play') return;
  for (const ev of D.events) { const m = MODS[ev.id]; m.move && m.move(ev, x - D.ox, y - D.oy, dx); }
});
addEventListener('pointerup', () => {
  ptr.down = false;
  if (sceneName !== 'desk') return;
  for (const ev of D.events) { const m = MODS[ev.id]; m.up && m.up(ev); }
});

padEl.querySelectorAll('button[data-k]').forEach(b => {
  const k = b.dataset.k;
  const on = e => { e.preventDefault(); keys[k] = true; b.classList.add('hot'); };
  const off = e => { e.preventDefault(); keys[k] = false; b.classList.remove('hot'); };
  b.addEventListener('pointerdown', on); b.addEventListener('pointerup', off); b.addEventListener('pointercancel', off); b.addEventListener('pointerleave', off);
});

/* =====================================================================
   go
   ===================================================================== */
layout();
bake();
Promise.all([
  ...imgs.filter(Boolean).map(im => im.decode ? im.decode().catch(() => {}) : new Promise(r => { im.onload = im.onerror = r; })),
  document.fonts ? document.fonts.load('400 16px "Silkscreen"').catch(() => {}) : null,
]).then(() => { glyphs.clear(); bake(); bake(); });   // twice: the second time, hw1's window can show the street
// jump straight in while working on a part: #walk, #desk, #level2, #level3, #end
const jump = location.hash.slice(1);
if (jump === 'walk') { mode = 'walk'; walker.shown = true; walker.x = car.x + 12; walker.y = car.y + 2; cam.y = introEnd; document.body.style.overflow = 'hidden'; }
else if (jump === 'desk') startCard(1);
else if (jump === 'play') startDesk();
else if (jump === 'lookup') { startDesk(); D.state = 'won'; D.winT = 3; startLookup(); }
else if (jump === 'level2') startMap(null);
else if (jump === 'dive') { startMap(null); startDive(); }
else if (jump === 'level3') startInbox();
else if (jump === 'end') startCard(4);
// ?debug: a handle on the game from the console, for testing a level without playing up to it
if (/[?&]debug/.test(location.search)) window.IW = { D, MODS, spawn, explode: () => D.events[0] && explode(D.events[0]), startDesk, startCard, walker, keys, get mode() { return mode; }, set t(v) { D.t = v; } };
requestAnimationFrame(frame);
})();
</script>
